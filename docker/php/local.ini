; Konfigurasi PHP untuk development (di-mount read-only oleh docker-compose).
; Production memakai konfigurasi yang di-bake di Dockerfile (zz-production.ini).

; Runtime
memory_limit = 256M
max_execution_time = 30
date.timezone = UTC
expose_php = Off

; Upload (selaras dengan client_max_body_size 10M di Nginx)
upload_max_filesize = 10M
post_max_size = 12M

; Error handling: tampilkan lewat Laravel, catat ke stderr container
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; OPcache: cek perubahan file agar kode hasil edit langsung terbaca
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
